name: show-metadata-syncer        # docker compose project name → stack/network use this prefix

services:
  syncer:
    build: .
    image: show-metadata-syncer:latest
    container_name: show-metadata-syncer
    restart: unless-stopped
    ports:
      - "7711:7711"
    volumes:
      - ./output:/app/output   # NFO + 圖片輸出
      - ./data:/app/data       # persists runtime settings written via /api/settings
    environment:
      # These env vars seed the initial defaults. Anything saved through the
      # UI later overrides them and persists across container restarts.
      SEARCH_LANG: zho
      LANG_PRIORITY: "zhtw,zho,jpn,eng"
      EPISODE_DELAY: "0.5"
      FUZZ_THRESHOLD: "75"
      CORS_ORIGINS: "*"
      TZ: Asia/Taipei
