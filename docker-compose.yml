services:
  tvdb-crawler:
    build: .
    image: tvdb-nfo-crawler:latest
    container_name: tvdb-nfo-crawler
    restart: unless-stopped
    ports:
      - "7711:7711"
    environment:
      HOST: 0.0.0.0
      PORT: "7711"
      TZ: Asia/Taipei
    volumes:
      - ./output:/app/output
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7711/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
